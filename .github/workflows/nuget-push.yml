name: 📦Publish .NET Tool to NuGet

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release Assets
        uses: ./.github/actions/build-release-assets

      - name: Pack
        run: dotnet pack ./EasyDotnet.IDE

      - name: Verify package assets
        run: |
          unzip -l EasyDotnet.IDE/bin/Release/*.nupkg | tee /tmp/easy-dotnet-package.txt
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64; do
            grep -q "tools/dncdbg/$rid/" /tmp/easy-dotnet-package.txt
          done
          grep -q "tools/sharpdbg/SharpDbg.Cli.dll" /tmp/easy-dotnet-package.txt

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: GustavEikaas

      - name: Push to NuGet (ignore conflict errors)
        run: |
          dotnet nuget push EasyDotnet.IDE/bin/Release/*.nupkg \
            --api-key ${{steps.login.outputs.NUGET_API_KEY}}   \
            --source https://api.nuget.org/v3/index.json       \
            --skip-duplicate
