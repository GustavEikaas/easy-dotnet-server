name: 🛠 CI build

on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./EasyDotnet.slnx

      - name: Check formatting
        run: dotnet format ./EasyDotnet.slnx --verify-no-changes

      - name: Build
        run: dotnet build --no-restore

      - name: Generate RPC docs
        run: dotnet run --no-build --no-restore --project ./EasyDotnet.IDE/EasyDotnet.IDE.csproj -- generate-rpc-docs --format markdown

      - name: Check for uncommitted changes (rpcDoc.md)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add rpcDoc.md
          git status
          git diff HEAD -- rpcDoc.md || true
          if ! git diff --quiet HEAD -- rpcDoc.md; then
            echo "rpcDoc.md is outdated. Please regenerate and commit changes."
            exit 1
          fi

  container-tests:
    name: ContainerTests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Shards are balanced by measured test time. "other" excludes the explicit shards, so new
        # namespaces are picked up without touching this list.
        include:
          - shard: workspace-run
            filter: FullyQualifiedName~EasyDotnet.ContainerTests.Workspace.Run.
          - shard: testrunner
            filter: FullyQualifiedName~EasyDotnet.ContainerTests.TestRunner.
          - shard: other
            filter: FullyQualifiedName!~EasyDotnet.ContainerTests.Workspace.Run.&FullyQualifiedName!~EasyDotnet.ContainerTests.TestRunner.

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # EasyDotnet.IDE publishes Aspire, AppWrapper, BuildServer and StartupHook from its build via the
      # MSBuild task. Those aren't ProjectReferences, so restoring only the test project misses them.
      - name: Restore
        run: dotnet restore ./EasyDotnet.slnx

      - name: ContainerTests
        run: dotnet test EasyDotnet.ContainerTests --filter "${{ matrix.filter }}"
